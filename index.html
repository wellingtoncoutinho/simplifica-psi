<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplePsi</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- PWA iOS & Android Home Screen Config -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SimplePsi" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Web Favicons & Cache-Busters -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    
    <!-- Apple Touch Icon (PWA iOS & Samsung Compatibility) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    
    <!-- Android / Samsung Chrome Icon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png?v=2" />

    <!-- Safari / WebKit Compatibility & Private Browsing Polyfill -->
    <script>
      (function() {
        if (typeof Promise !== 'undefined' && typeof Promise.withResolvers === 'undefined') {
          Promise.withResolvers = function() {
            var resolve, reject;
            var promise = new Promise(function(res, rej) {
              resolve = res;
              reject = rej;
            });
            return { promise: promise, resolve: resolve, reject: reject };
          };
        }
        try {
          var testKey = '__simplepsi_probe__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
        } catch (e) {
          console.warn('Safari Private Window: using in-memory storage proxy');
          var mem = {};
          try {
            Object.defineProperty(window, 'localStorage', {
              value: {
                getItem: function(k) { return mem[k] || null; },
                setItem: function(k, v) { mem[k] = String(v); },
                removeItem: function(k) { delete mem[k]; },
                clear: function() { mem = {}; },
                key: function(i) { return Object.keys(mem)[i] || null; },
                get length() { return Object.keys(mem).length; }
              },
              writable: true,
              configurable: true
            });
          } catch(err) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
